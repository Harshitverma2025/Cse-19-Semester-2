<!DOCTYPE html>
<html>
<head>
    <title>Number Pattern</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
            margin-top: 50px;
        }

        input {
            padding: 8px;
            font-size: 16px;
        }

        button {
            padding: 8px 15px;
            font-size: 16px;
            margin-left: 10px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            font-size: 20px;
            white-space: pre;
        }
    </style>
</head>
<body>

    <h2>Number Pattern Generator</h2>

    <input type="number" id="num" placeholder="Enter number">
    <button onclick="printPattern()">Print</button>

    <div id="output"></div>

    <script>
        function printPattern() {
            let n = document.getElementById("num").value;
            let result = "";

            for (let i = 1; i <= n; i++) {
                for (let j = 1; j <= i; j++) {
                    result += j;
                }
                result += "\n";
            }

            document.getElementById("output").innerText = result;
        }
    </script>

</body>
</html>
